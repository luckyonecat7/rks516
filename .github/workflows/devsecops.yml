name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # CI JOB 1: SAST Scan (Semgrep)
  # ==========================================
  sast-scan:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: semgrep scan --config auto --error --verbose --exclude=".github"

  # ==========================================
  # CI JOB 2: Code Quality (Pylint)
  # ==========================================
  pylint-check:
    name: Pylint Code Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r requirements.txt

      - name: Run Pylint Check
        run: pylint --fail-under=9.0 app.py

  # ==========================================
  # CI JOB 3: Style Check (Flake8)
  # ==========================================
  flake8-check:
    name: Flake8 Style Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Run Flake8
        run: |
          pip install flake8
          flake8 --max-line-length=100 app.py tests

  # ==========================================
  # CI JOB 4: SAST Python (Bandit)
  # ==========================================
  bandit-scan:
    name: Bandit Python Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r app.py -ll

  # ==========================================
  # CI JOB 5: Dependency Audit (pip-audit)
  # ==========================================
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  # ==========================================
  # CI JOB 6: Unit Test + Coverage (pytest)
  # ==========================================
  unit-test:
    name: Unit Test and Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ==========================================
  # CI JOB 7: Dockerfile Lint (Hadolint)
  # ==========================================
  dockerfile-lint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Hadolint
        run: docker run --rm -i hadolint/hadolint hadolint --failure-threshold warning - < Dockerfile

  # ==========================================
  # CI JOB 8: Docker Build + Smoke Test
  # ==========================================
  docker-smoke-test:
    name: Docker Build and Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Image
        run: docker build -t secure-flask-app:ci .
      - name: Run Container and Check /health
        run: |
          docker run -d -p 5000:5000 --name smoke secure-flask-app:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then
              echo; echo "Smoke test OK"; exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1

  # ==========================================
  # CD STAGE: Deploy ke VM (hanya setelah merge/push ke main)
  # ==========================================
  deploy-to-vm:
    name: Build & Deploy to VirtualBox VM
    needs:
      - sast-scan
      - pylint-check
      - flake8-check
      - bandit-scan
      - dependency-audit
      - unit-test
      - dockerfile-lint
      - docker-smoke-test
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build and Run Container
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          docker build -t secure-flask-app:latest .
          docker stop web-flask || true
          docker rm web-flask || true
          docker run -d -p 5000:5000 --restart unless-stopped \
            -e SECRET_KEY="$SECRET_KEY" --name web-flask secure-flask-app:latest
          docker ps | grep web-flask
