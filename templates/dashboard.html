<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — PBL RKS 516</title>
    <!-- nosemgrep: html.security.audit.missing-integrity.missing-integrity -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- nosemgrep: html.security.audit.missing-integrity.missing-integrity -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#3B82F6',
                        'primary-dark': '#2563EB',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes pop { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        .animate-pop { animation: pop 0.5s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-900 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- Dashboard Card -->
    <div class="w-full max-w-md bg-gray-800 border border-gray-700 rounded-xl p-8 shadow-2xl animate-fade-in">

        <!-- Success Icon -->
        <div class="flex justify-center mb-6">
            <div class="w-16 h-16 bg-green-500/20 border border-green-500/30 rounded-full flex items-center justify-center animate-pop">
                <svg class="w-8 h-8 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                </svg>
            </div>
        </div>

        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white mb-1">Login Berhasil!</h1>
            <p class="text-sm text-gray-400">Selamat datang kembali di dashboard</p>
        </div>

        <!-- User Info Card -->
        <div class="bg-gray-900/60 border border-gray-700 rounded-lg p-4 mb-6">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center text-white font-bold text-sm">
                    {{ username[0]|upper }}
                </div>
                <div class="flex-1">
                    <p class="text-sm font-semibold text-white">{{ username }}</p>
                    <p class="text-xs text-gray-400">Pentest Team Member</p>
                </div>
                <span class="px-2 py-1 bg-green-500/10 border border-green-500/30 text-green-400 text-xs rounded-full">Online</span>
            </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="bg-gray-900/60 border border-gray-700 rounded-lg p-3 text-center">
                <p class="text-lg font-bold text-white">12</p>
                <p class="text-xs text-gray-400">Projects</p>
            </div>
            <div class="bg-gray-900/60 border border-gray-700 rounded-lg p-3 text-center">
                <p class="text-lg font-bold text-white">48</p>
                <p class="text-xs text-gray-400">Vulns</p>
            </div>
            <div class="bg-gray-900/60 border border-gray-700 rounded-lg p-3 text-center">
                <p class="text-lg font-bold text-white">5</p>
                <p class="text-xs text-gray-400">Reports</p>
            </div>
        </div>

        <!-- Buttons -->
        <div class="space-y-3">
            <button class="w-full py-2.5 bg-primary hover:bg-primary-dark text-white font-semibold rounded-lg text-sm transition">
                Buka Dashboard
            </button>
            <a href="{{ url_for('logout') }}" class="block w-full py-2.5 bg-gray-700 hover:bg-gray-600 text-white font-medium rounded-lg text-sm transition text-center">
                Logout
            </a>
        </div>

        <!-- Back Link -->
        <p class="text-center text-sm text-gray-500 mt-6">
            <a href="{{ url_for('index') }}" class="text-primary hover:text-primary-light transition">← Back to Home</a>
        </p>
    </div>

</body>
</html>
